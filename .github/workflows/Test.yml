
name: E2E Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
      - name: Building
        run: echo "Building application..."

      - name: Build Complete
        run: echo "Build successful!"

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploying
        run: echo "Deploying application to test environment..."

      - name: Deployment Complete
        run: echo "Deployment successful!"

  test:
    name: Selenium E2E Tests
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Set up Chrome Browser
        uses: browser-actions/setup-chrome@v1

      - name: Run Selenium Tests
        run: mvn clean test

      - name: Allure Report action from marketplace
        if: always()
        uses: simple-elf/allure-report-action@master
        id: allure-report
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history

      - name: Deploy report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v2
        env:
          PERSONAL_TOKEN: ${{ secrets.TOKEN }}
          PUBLISH_BRANCH: gh-pages
          PUBLISH_DIR: allure-history

  notify:
    name: Email Allure Report
    runs-on: ubuntu-latest
    needs: [build, deploy, test]
    if: always()

    steps:
      - name: Send Allure Report Link
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          subject: Selenium E2E Test Report
          to: ${{ secrets.MAIL_TO }}
          from: Selenium E2E Automation
          body: |
            Your Selenium E2E pipeline has finished.

            Build status: ${{ needs.build.result }}
            Deploy status: ${{ needs.deploy.result }}
            Test and report job status: ${{ needs.test.result }}

            View the latest Allure Report:
            https://n3kcr0n.github.io/Selenium4AllureDemoProject/

            View the GitHub Actions run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
